experiment:
  name: "sst2_full_finetune"
  output_dir: "results"
  seed: 42

model:
  backbone: "distilbert-base-uncased"
  num_labels: 2

task:
  name: "text_classification"
  dataset: "sst2"
  text_key: "sentence"
  label_key: "label"
  max_length: 128

training:
  num_train_epochs: 3
  learning_rate: 2e-5
  batch_size: 16
  weight_decay: 0.01
  warmup_ratio: 0.06
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  logging_steps: 20

peft:
  method: "full"

  lora:
    r: 8
    alpha: 16
    dropout: 0.1
    target_modules:
      - "q_lin"
      - "v_lin"

  prefix:
    num_virtual_tokens: 20

  ptuning:
    num_virtual_tokens: 20
    encoder_hidden_size: 128